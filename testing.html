<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

    <!-- Header Section -->
<header class="bg-purple-300 shadow-md">
  <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
    <!-- Brand -->
    <h1 class="italic font-bold text-2xl text-gray-800">Dynx-Apparel</h1>

    <!-- Hamburger Icon (Visible on small screens only) -->
    <button id="menu-btn" class="text-3xl md:hidden focus:outline-none">
      <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2"
        viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- Desktop Menu (hidden on small screens) -->
    <nav class="hidden md:block">
      <ul class="flex items-center gap-10 text-lg font-medium">
        <li><a href="index.html" class="hover:text-purple-700 transition">Home</a></li>
        <li><a href="shop.html" class="hover:text-purple-700 transition">Shop</a></li>
        <li><a href="blog.html" class="hover:text-purple-700 transition">Blog</a></li>
        <li><a href="about.html" class="hover:text-purple-700 transition">About</a></li>
        <li><a href="contact.html" class="hover:text-purple-700 transition">Contact</a></li>
        <li class="bg-gray-100 py-2 px-3 rounded-full hover:bg-gray-200 transition">
          <a href="cart.html" class="text-2xl">🛒</a>
        </li>
      </ul>
    </nav>
  </div>

  <!-- Mobile Menu (shows when toggled) -->
  <nav id="menu" class="hidden flex-col bg-purple-100 md:hidden text-center space-y-4 py-5 animate-slideDown">
    <a href="index.html" class="block hover:text-purple-700">Home</a>
    <a href="shop.html" class="block hover:text-purple-700">Shop</a>
    <a href="blog.html" class="block hover:text-purple-700">Blog</a>
    <a href="about.html" class="block hover:text-purple-700">About</a>
    <a href="contact.html" class="block hover:text-purple-700">Contact</a>
    <a href="cart.html" class="block text-2xl">🛒</a>
  </nav>
</header>

<!-- Tailwind animation -->
<style>
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-slideDown {
  animation: slideDown 0.3s ease-out;
}
</style>

<!-- Toggle Script -->
<script>
  const menuBtn = document.getElementById('menu-btn');
  const menu = document.getElementById('menu');

  menuBtn.addEventListener('click', () => {
    menu.classList.toggle('hidden');
  });
</script>

    
</body>
</html>
